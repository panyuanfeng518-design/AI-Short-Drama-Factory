
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI短剧工厂</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #10131b;
      color: #f5f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .container {
      max-width: 760px;
      margin: auto;
      padding: 22px 16px 50px;
    }
    h1 { font-size: 27px; margin-bottom: 8px; }
    .sub { color: #9da8ba; margin-bottom: 25px; }
    .card {
      background: #1b2130;
      border: 1px solid #30394d;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin: 14px 0 8px;
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      background: #101722;
      color: white;
      border: 1px solid #38445c;
      border-radius: 10px;
      padding: 13px;
      font-size: 16px;
    }
    textarea { min-height: 150px; resize: vertical; }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      background: #6b7cff;
      color: white;
      font-size: 16px;
      font-weight: 700;
      margin-top: 18px;
    }
    button:disabled { opacity: .5; }
    #status { color: #aeb9ca; margin-top: 14px; }
    #result {
      white-space: pre-wrap;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }
    .small { color: #8996aa; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 AI短剧工厂</h1>
    <div class="sub">真人影视 · AI剧本 · 自动分镜</div>

    <div class="card">
      <label>短剧名称</label>
      <input id="title" placeholder="例如：最后一封情书">

      <label>故事 / 小说内容</label>
      <textarea id="story" placeholder="输入你的小说、故事梗概或剧情创意……"></textarea>

      <label>单集时长</label>
      <select id="duration">
        <option value="30">30秒</option>
        <option value="45" selected>45秒</option>
        <option value="60">60秒</option>
      </select>

      <label>题材类型</label>
      <select id="genre">
        <option>都市情感</option>
        <option>悬疑反转</option>
        <option>霸总爱情</option>
        <option>家庭伦理</option>
        <option>复仇爽剧</option>
        <option>奇幻穿越</option>
      </select>

      <button id="generate">✨ AI生成短剧剧本</button>
      <div id="status"></div>
    </div>

    <div class="card">
      <h3>生成结果</h3>
      <div id="result">等待生成剧本……</div>
      <button id="copy" style="background:#34425b">复制剧本</button>
    </div>

    <div class="small">
      提示：视频生成、配音和自动剪辑将在后续阶段接入。
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);

    $("generate").onclick = async () => {
      const story = $("story").value.trim();

      if (!story) {
        alert("请先输入故事内容");
        return;
      }

      $("generate").disabled = true;
      $("status").textContent = "AI正在创作，请稍候……";
      $("result").textContent = "";

      try {
        const response = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: $("title").value,
            story,
            duration: $("duration").value,
            genre: $("genre").value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "生成失败");
        }

        $("result").textContent = data.result;
        $("status").textContent = "✅ 剧本生成成功";
      } catch (error) {
        $("status").textContent = "❌ " + error.message;
      } finally {
        $("generate").disabled = false;
      }
    };

    $("copy").onclick = async () => {
      await navigator.clipboard.writeText($("result").textContent);
      alert("剧本已复制");
    };
  </script>
</body>
</html>
